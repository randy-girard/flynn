name: Dispatch plugin releases

# Runs after a Flynn GitHub Release is published (not drafts). Plugin repos
# are listed in the PLUGIN_RELEASE_REPOS Actions variable so Flynn source
# never hardcodes appliance names. GITHUB_TOKEN cannot start workflows in
# other repos; PLUGIN_RELEASE_TOKEN must be a PAT or GitHub App token with
# Actions: write (and Contents: read, to skip tags that already exist).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Flynn release tag to rebuild plugins against (e.g. v20260915.0)"
        required: true
        type: string
      prerelease:
        description: "Mark plugin GitHub Releases as prereleases"
        required: false
        type: boolean
        default: false

concurrency:
  group: plugin-releases-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch plugin Build and Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tag names and inputs reach the script through env, never pasted into it.
      - name: Resolve version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -eo pipefail
          if [[ "${EVENT_NAME}" == "release" ]]; then
            version="${RELEASE_TAG}"
            prerelease="${RELEASE_PRERELEASE}"
          else
            version="${INPUT_VERSION}"
            prerelease="${INPUT_PRERELEASE}"
          fi
          if [[ ! "${version}" =~ ^v[0-9]{8}\.[0-9]+$ ]]; then
            echo "ERROR: version must look like vYYYYMMDD.N (got '${version}')" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch plugin releases
        env:
          PLUGIN_RELEASE_REPOS: ${{ vars.PLUGIN_RELEASE_REPOS }}
          PLUGIN_RELEASE_TOKEN: ${{ secrets.PLUGIN_RELEASE_TOKEN }}
        run: |
          set -eo pipefail
          ARGS=(--version "${{ steps.meta.outputs.version }}")
          if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          ./script/dispatch-plugin-releases "${ARGS[@]}"
