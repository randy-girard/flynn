name: Build and Release

# Manual release only. Unit tests run via the separate Unit tests workflow;
# this workflow splits the Flynn build across jobs/steps for fresh timeout budgets
# (base → host binaries → toolchain images → app images).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the release (e.g., v20260904.0)'
        required: true
        type: string
      draft:
        description: 'Create as a draft (unpublished until you publish it in GitHub)'
        required: false
        type: boolean
        default: true
      concurrency:
        description: 'Parallel flynn-builder app image builds (phase 2; default 4)'
        required: false
        type: string
        default: '4'
      toolchain_concurrency:
        description: 'Parallel flynn-builder toolchain image builds (phase 1; default 2)'
        required: false
        type: string
        default: '2'
      runner:
        description: 'GitHub Actions runner label (use a larger runner if your org has one)'
        required: false
        type: string
        default: 'ubuntu-24.04'

permissions:
  contents: write

env:
  GO_VERSION: '1.24'
  GOFLAGS: '-mod=vendor'

jobs:
  build-base:
    name: Build base image
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        run: |
          set -eo pipefail
          VERSION="${{ inputs.version }}"
          if [[ ! "${VERSION}" =~ ^v[0-9]{8}\.[0-9]+$ ]]; then
            echo "ERROR: version must look like vYYYYMMDD.N (got '${VERSION}')" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building base for ${VERSION}"

      - name: Set up Flynn environment
        run: |
          echo "FLYNN_ROOT=${{ github.workspace }}" >> "$GITHUB_ENV"
          git config --global --add safe.directory "${{ github.workspace }}"
          sudo git config --system --add safe.directory "${{ github.workspace }}"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debootstrap \
            squashfs-tools \
            zfsutils-linux \
            jq \
            curl \
            git \
            pigz

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build sha512_256_binary tool
        run: |
          cd "${{ env.FLYNN_ROOT }}"
          go build -o sha512_256_binary sha512_256.go

      - name: Set up Flynn directories
        run: |
          sudo mkdir -p /var/lib/flynn /var/log/flynn /etc/flynn /tmp/discoverd-data /var/run/flynn-local

      - name: Run build.sh base
        env:
          FLYNN_BUILD_SKIP_TEARDOWN: "1"
        run: |
          cd "${{ env.FLYNN_ROOT }}"
          sudo -E ./build.sh --version "${{ steps.version.outputs.VERSION }}" base

      - name: Stage base artifacts
        run: |
          mkdir -p "${{ github.workspace }}/ci-artifacts/base"
          sudo cp -a /var/lib/flynn/base-layer.squashfs \
            "${{ github.workspace }}/ci-artifacts/base/base-layer.squashfs"
          sudo cp -a "${{ github.workspace }}/builder/manifest.json" \
            "${{ github.workspace }}/ci-artifacts/base/manifest.json"
          sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}/ci-artifacts"

      - name: Upload base artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flynn-base-${{ steps.version.outputs.VERSION }}
          path: ci-artifacts/base/
          if-no-files-found: error
          retention-days: 7

  build-cluster:
    name: Build cluster images
    needs: build-base
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Flynn environment
        run: |
          echo "FLYNN_ROOT=${{ github.workspace }}" >> "$GITHUB_ENV"
          git config --global --add safe.directory "${{ github.workspace }}"
          sudo git config --system --add safe.directory "${{ github.workspace }}"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debootstrap \
            squashfs-tools \
            zfsutils-linux \
            jq \
            curl \
            git \
            gh \
            iptables \
            iproute2 \
            net-tools \
            bridge-utils \
            libdevmapper-dev \
            libseccomp-dev \
            pkg-config \
            pigz

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up ZFS pool
        run: |
          # Larger pool + disabled sync: cluster image builds are I/O heavy.
          sudo truncate -s 40G /zfs-pool.img
          sudo zpool create -f flynn-default /zfs-pool.img
          sudo zfs set compression=lz4 flynn-default
          sudo zfs set sync=disabled flynn-default
          echo 2147483648 | sudo tee /sys/module/zfs/parameters/zfs_arc_max

      - name: Add swap
        run: |
          # Extra swap absorbs concurrent go builds when runner RAM is tight.
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Set up Flynn directories
        run: |
          sudo mkdir -p /var/lib/flynn /var/log/flynn /etc/flynn /tmp/discoverd-data /var/run/flynn-local /var/lib/flynn/layer-cache

      - name: Build sha512_256_binary tool
        run: |
          cd "${{ env.FLYNN_ROOT }}"
          go build -o sha512_256_binary sha512_256.go

      - name: Download base artifacts
        uses: actions/download-artifact@v4
        with:
          name: flynn-base-${{ steps.version.outputs.VERSION }}
          path: ci-artifacts/base

      - name: Restore base squashfs and manifest
        run: |
          sudo cp -a ci-artifacts/base/base-layer.squashfs /var/lib/flynn/base-layer.squashfs
          cp -a ci-artifacts/base/manifest.json builder/manifest.json
          ls -lh /var/lib/flynn/base-layer.squashfs builder/manifest.json

      - name: Prepare cluster environment
        env:
          FLYNN_BUILD_SKIP_TEARDOWN: "1"
        run: |
          set -eo pipefail
          cd "${{ env.FLYNN_ROOT }}"
          sudo -E ./build.sh --version "${{ steps.version.outputs.VERSION }}" prep

      - name: Build host binaries
        run: |
          set -eo pipefail
          cd "${{ env.FLYNN_ROOT }}"
          sudo -E ./build.sh --version "${{ steps.version.outputs.VERSION }}" binaries

      - name: Start Flynn cluster
        run: |
          set -eo pipefail
          cd "${{ env.FLYNN_ROOT }}"
          sudo -E ./build.sh --version "${{ steps.version.outputs.VERSION }}" start

      - name: Build toolchain images
        env:
          TOOLCHAIN_CONCURRENCY: ${{ inputs.toolchain_concurrency }}
        run: |
          set -eo pipefail
          cd "${{ env.FLYNN_ROOT }}"
          echo "Building toolchain images with concurrency=${TOOLCHAIN_CONCURRENCY}"
          (
            while true; do
              sleep 300
              echo "[heartbeat] toolchain still building at $(date -u +%H:%M:%SZ); load=$(cut -d' ' -f1-3 /proc/loadavg); mem=$(awk '/MemAvailable/{printf "%dMB", $2/1024}' /proc/meminfo)"
            done
          ) &
          HB_PID=$!
          trap 'kill "${HB_PID}" 2>/dev/null || true' EXIT
          sudo -E ./build.sh --version "${{ steps.version.outputs.VERSION }}" toolchain

      - name: Build app images
        env:
          APPS_CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          set -eo pipefail
          cd "${{ env.FLYNN_ROOT }}"
          echo "Building app images with concurrency=${APPS_CONCURRENCY}"
          (
            while true; do
              sleep 300
              echo "[heartbeat] apps still building at $(date -u +%H:%M:%SZ); load=$(cut -d' ' -f1-3 /proc/loadavg); mem=$(awk '/MemAvailable/{printf "%dMB", $2/1024}' /proc/meminfo)"
            done
          ) &
          HB_PID=$!
          trap 'kill "${HB_PID}" 2>/dev/null || true' EXIT
          sudo -E ./build.sh --version "${{ steps.version.outputs.VERSION }}" apps

      - name: Stop Flynn cluster
        if: success()
        run: |
          set -eo pipefail
          cd "${{ env.FLYNN_ROOT }}"
          sudo -E ./build.sh --version "${{ steps.version.outputs.VERSION }}" stop

      - name: Package release tarball
        run: |
          cd "${{ env.FLYNN_ROOT }}"
          sudo -E ./script/release \
            --target tarball \
            --version "${{ steps.version.outputs.VERSION }}"
          sudo chown -R "$(id -u):$(id -g)" build/release
          ls -lh build/release/

      - name: Upload release tarball
        uses: actions/upload-artifact@v4
        with:
          name: flynn-release-${{ steps.version.outputs.VERSION }}
          path: build/release/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          set +e
          cd "${{ env.FLYNN_ROOT }}"
          echo "===> Stopping local Flynn processes (best-effort)..."
          sudo ./script/stop-all || true
          # Hosted runners are discarded after the job; do not block forever if ZFS
          # datasets are still busy from leftover container mounts.
          echo "===> Destroying flynn-default zpool (60s timeout)..."
          if timeout 60 sudo zpool destroy -f flynn-default; then
            echo "===> zpool destroy succeeded"
          else
            echo "===> zpool destroy timed out or failed (exit=$?); skipping — runner is ephemeral"
            sudo zpool status flynn-default 2>/dev/null || true
          fi
          echo "===> Cleanup finished"

  publish:
    name: Publish GitHub release
    needs: build-cluster
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release mode
        id: mode
        run: |
          DRAFT=false
          PRERELEASE=false
          if [[ "${{ inputs.draft }}" == "true" ]]; then
            DRAFT=true
            PRERELEASE=true
          fi
          echo "DRAFT=${DRAFT}" >> "$GITHUB_OUTPUT"
          echo "PRERELEASE=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Validate version
        id: version
        run: |
          set -eo pipefail
          VERSION="${{ inputs.version }}"
          git fetch --tags --force
          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "ERROR: tag ${VERSION} already exists" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: flynn-release-${{ steps.version.outputs.VERSION }}
          path: build/release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES_FILE="$(mktemp)"
          {
            echo "## Flynn ${VERSION}"
            echo
            echo "Built from \`${GITHUB_SHA}\` via workflow_dispatch."
            echo
            PREVIOUS_TAG=$(git tag -l 'v*' | sort -V | tail -n1 || true)
            if [[ -n "${PREVIOUS_TAG}" ]]; then
              echo "### Changes since ${PREVIOUS_TAG}"
              echo
              git log --pretty=format:'- %s (%h)' "${PREVIOUS_TAG}..HEAD" | head -n 100 || true
            fi
          } > "${NOTES_FILE}"

          ARGS=(--title "Flynn ${VERSION}" --notes-file "${NOTES_FILE}")
          if [[ "${{ steps.mode.outputs.DRAFT }}" == "true" ]]; then
            ARGS+=(--draft)
          fi
          if [[ "${{ steps.mode.outputs.PRERELEASE }}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          shopt -s nullglob
          FILES=(build/release/*)
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "ERROR: no release files found in build/release" >&2
            exit 1
          fi

          gh release create "${VERSION}" "${ARGS[@]}" "${FILES[@]}"
          echo "Created release ${VERSION}"
          gh release view "${VERSION}"
