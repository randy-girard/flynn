name: Build and Release

# Manual release only. Unit tests run via the separate Unit tests workflow;
# this workflow splits the Flynn build across jobs/steps for fresh timeout budgets
# (base → host binaries → toolchain images → production app images).
# Cluster-test images (test, test-apps, controller-examples) are omitted; they
# are not in bootstrap or the release images template. Build them with
# `./build.sh test` when running the cluster integration suite.
# Plugin rebuilds: dispatch_plugins defaults on so plugin-releases.yml runs after
# the Flynn GitHub Release exists. Uncheck it to skip fan-out. GITHUB_TOKEN cannot
# start other workflows via the release published event; publishing a draft in
# the GitHub UI still can.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v20260917.0). Leave empty to use today UTC and the next .N'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create as a draft (unpublished until you publish it in GitHub)'
        required: false
        type: boolean
        default: false
      dispatch_plugins:
        description: 'Queue Dispatch plugin releases (plugin Build and Release fan-out) after this Flynn release'
        required: false
        type: boolean
        default: true
      concurrency:
        description: 'Parallel flynn-builder app image builds (phase 2; default 2 on hosted runners)'
        required: false
        type: string
        default: '2'
      toolchain_concurrency:
        description: 'Parallel flynn-builder toolchain image builds (phase 1; default 2)'
        required: false
        type: string
        default: '2'
      runner:
        description: 'GitHub Actions runner label (use a larger runner if your org has one)'
        required: false
        type: string
        default: 'ubuntu-24.04'

permissions:
  contents: write
  actions: write

env:
  GO_VERSION: '1.24'
  GOFLAGS: '-mod=vendor -buildvcs=false'

jobs:
  build-base:
    name: Build base image
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -eo pipefail
          git fetch --tags --force
          VERSION="${{ inputs.version }}"
          if [[ -z "${VERSION}" ]]; then
            # shellcheck source=script/lib/release.sh
            source ./script/lib/release.sh
            VERSION="$(next_release_version_from_tags)"
            echo "Using next version ${VERSION}"
          elif [[ ! "${VERSION}" =~ ^v[0-9]{8}\.[0-9]+$ ]]; then
            echo "ERROR: version must look like vYYYYMMDD.N (got '${VERSION}')" >&2
            exit 1
          fi
          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "ERROR: tag ${VERSION} already exists" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building base for ${VERSION}"

      - name: Set up Flynn environment
        run: |
          echo "FLYNN_ROOT=${{ github.workspace }}" >> "$GITHUB_ENV"
          git config --global --add safe.directory "${{ github.workspace }}"
          sudo git config --system --add safe.directory "${{ github.workspace }}"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debootstrap \
            squashfs-tools \
            zfsutils-linux \
            jq \
            curl \
            git \
            pigz

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build sha512_256_binary tool
        run: |
          cd "${{ env.FLYNN_ROOT }}"
          go build -o sha512_256_binary sha512_256.go

      - name: Set up Flynn directories
        run: |
          sudo mkdir -p /var/lib/flynn /var/log/flynn /etc/flynn /tmp/discoverd-data /var/run/flynn-local

      - name: Run build.sh base
        env:
          FLYNN_BUILD_SKIP_TEARDOWN: "1"
        run: |
          cd "${{ env.FLYNN_ROOT }}"
          sudo -E ./build.sh --version "${{ steps.version.outputs.VERSION }}" base

      - name: Stage base artifacts
        run: |
          mkdir -p "${{ github.workspace }}/ci-artifacts/base"
          sudo cp -a /var/lib/flynn/base-layer.squashfs \
            "${{ github.workspace }}/ci-artifacts/base/base-layer.squashfs"
          sudo cp -a "${{ github.workspace }}/builder/manifest.json" \
            "${{ github.workspace }}/ci-artifacts/base/manifest.json"
          sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}/ci-artifacts"

      - name: Upload base artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flynn-base-${{ steps.version.outputs.VERSION }}
          path: ci-artifacts/base/
          if-no-files-found: error
          retention-days: 7

  build-cluster:
    name: Build cluster images
    needs: build-base
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      # Cap compiler fan-out inside each overlay job. Hosted runners OOM when
      # several images each compile with GOMAXPROCS.
      FLYNN_GO_BUILD_P: "2"
      FLYNN_IMAGE_BUILD_TIMEOUT: "30m"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ needs.build-base.outputs.VERSION }}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Flynn environment
        run: |
          echo "FLYNN_ROOT=${{ github.workspace }}" >> "$GITHUB_ENV"
          git config --global --add safe.directory "${{ github.workspace }}"
          sudo git config --system --add safe.directory "${{ github.workspace }}"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debootstrap \
            squashfs-tools \
            zfsutils-linux \
            jq \
            curl \
            git \
            gh \
            iptables \
            iproute2 \
            net-tools \
            bridge-utils \
            libdevmapper-dev \
            libseccomp-dev \
            pkg-config \
            pigz

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up ZFS pool
        run: |
          # Larger pool + disabled sync: cluster image builds are I/O heavy.
          sudo truncate -s 40G /zfs-pool.img
          sudo zpool create -f flynn-default /zfs-pool.img
          sudo zfs set compression=lz4 flynn-default
          sudo zfs set sync=disabled flynn-default
          echo 2147483648 | sudo tee /sys/module/zfs/parameters/zfs_arc_max

      - name: Add swap
        run: |
          # Extra swap absorbs concurrent go builds when runner RAM is tight.
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Set up Flynn directories
        run: |
          sudo mkdir -p /var/lib/flynn /var/log/flynn /etc/flynn /tmp/discoverd-data /var/run/flynn-local /var/lib/flynn/layer-cache

      - name: Build sha512_256_binary tool
        run: |
          cd "${{ env.FLYNN_ROOT }}"
          go build -o sha512_256_binary sha512_256.go

      - name: Download base artifacts
        uses: actions/download-artifact@v8
        with:
          name: flynn-base-${{ steps.version.outputs.VERSION }}
          path: ci-artifacts/base

      - name: Restore base squashfs and manifest
        run: |
          sudo cp -a ci-artifacts/base/base-layer.squashfs /var/lib/flynn/base-layer.squashfs
          cp -a ci-artifacts/base/manifest.json builder/manifest.json
          ls -lh /var/lib/flynn/base-layer.squashfs builder/manifest.json

      - name: Prepare cluster environment
        env:
          FLYNN_BUILD_SKIP_TEARDOWN: "1"
        run: |
          set -eo pipefail
          cd "${{ env.FLYNN_ROOT }}"
          sudo -E ./build.sh --version "${{ steps.version.outputs.VERSION }}" prep

      - name: Build host binaries
        run: |
          set -eo pipefail
          cd "${{ env.FLYNN_ROOT }}"
          sudo -E ./build.sh --version "${{ steps.version.outputs.VERSION }}" binaries

      - name: Start Flynn cluster
        run: |
          set -eo pipefail
          cd "${{ env.FLYNN_ROOT }}"
          sudo -E ./build.sh --version "${{ steps.version.outputs.VERSION }}" start

      - name: Build toolchain images
        timeout-minutes: 45
        env:
          TOOLCHAIN_CONCURRENCY: ${{ inputs.toolchain_concurrency }}
        run: |
          set -eo pipefail
          cd "${{ env.FLYNN_ROOT }}"
          echo "::remove-matcher owner=go::"
          echo "Building toolchain images with concurrency=${TOOLCHAIN_CONCURRENCY}"
          (
            while true; do
              sleep 60
              echo "[heartbeat] toolchain still building at $(date -u +%H:%M:%SZ); load=$(cut -d' ' -f1-3 /proc/loadavg); mem=$(awk '/MemAvailable/{printf "%dMB", $2/1024}' /proc/meminfo)"
              sudo flynn-host ps -a 2>/dev/null | head -n 20 || true
            done
          ) &
          HB_PID=$!
          trap 'kill "${HB_PID}" 2>/dev/null || true' EXIT
          sudo -E ./build.sh --version "${{ steps.version.outputs.VERSION }}" toolchain

      - name: Build app images
        timeout-minutes: 90
        env:
          APPS_CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          set -eo pipefail
          cd "${{ env.FLYNN_ROOT }}"
          echo "::remove-matcher owner=go::"
          echo "Building production app images with concurrency=${APPS_CONCURRENCY} (omitting test, test-apps, controller-examples)"
          (
            while true; do
              sleep 60
              echo "[heartbeat] apps still building at $(date -u +%H:%M:%SZ); load=$(cut -d' ' -f1-3 /proc/loadavg); mem=$(awk '/MemAvailable/{printf "%dMB", $2/1024}' /proc/meminfo)"
              sudo flynn-host ps -a 2>/dev/null | head -n 20 || true
            done
          ) &
          HB_PID=$!
          trap 'kill "${HB_PID}" 2>/dev/null || true' EXIT
          sudo -E ./build.sh --version "${{ steps.version.outputs.VERSION }}" apps

      - name: Stop Flynn cluster
        if: success()
        run: |
          set -eo pipefail
          cd "${{ env.FLYNN_ROOT }}"
          sudo -E ./build.sh --version "${{ steps.version.outputs.VERSION }}" stop

      - name: Package release assets
        run: |
          cd "${{ env.FLYNN_ROOT }}"
          # Individual assets (binaries, layers, install scripts) — not a mega-tarball.
          # GitHub Releases reject any single asset >= 2GiB.
          sudo -E ./script/release \
            --target package \
            --version "${{ steps.version.outputs.VERSION }}"
          sudo chown -R "$(id -u):$(id -g)" build/release
          # shellcheck source=script/lib/release-layers.sh
          source ./script/lib/release-layers.sh
          if [[ -f build/release/images.json.gz ]]; then
            flynn_verify_images_json_layers build/release/images.json.gz build/release
          else
            echo "ERROR: packaged release is missing images.json.gz" >&2
            exit 1
          fi
          ls -lah build/release/ | head -n 50
          echo "..."
          echo "Total files: $(find build/release -type f | wc -l)"
          du -sh build/release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flynn-release-${{ steps.version.outputs.VERSION }}
          path: build/release/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          set +e
          cd "${{ env.FLYNN_ROOT }}"
          echo "===> Stopping local Flynn processes (best-effort)..."
          sudo ./script/stop-all || true
          # Do not call zpool destroy here. After Flynn image builds, datasets are
          # often still busy; destroy can sit in uninterruptible kernel sleep where
          # even `timeout`/`SIGKILL` cannot unblock the step. Hosted runners are
          # discarded after the job, so leaving the pool is fine.
          echo "===> Skipping zpool destroy on ephemeral runner"
          echo "===> Cleanup finished"

  publish:
    name: Publish GitHub release
    needs: [build-base, build-cluster]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine release mode
        id: mode
        run: |
          DRAFT=false
          PRERELEASE=false
          if [[ "${{ inputs.draft }}" == "true" ]]; then
            DRAFT=true
            PRERELEASE=true
          fi
          echo "DRAFT=${DRAFT}" >> "$GITHUB_OUTPUT"
          echo "PRERELEASE=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        run: |
          set -eo pipefail
          VERSION="${{ needs.build-base.outputs.VERSION }}"
          git fetch --tags --force
          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "ERROR: tag ${VERSION} already exists" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: flynn-release-${{ steps.version.outputs.VERSION }}
          path: build/release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES_FILE="$(mktemp)"
          ./script/release \
            --target notes \
            --version "${VERSION}" \
            --github-repo "${GITHUB_REPOSITORY}" \
            --output "${NOTES_FILE}"
          echo "----- release notes (grouped) -----"
          cat "${NOTES_FILE}"
          echo "-----------------------------------"

          # shellcheck source=script/lib/github-release-upload.sh
          source ./script/lib/github-release-upload.sh
          github_release_publish \
            --version "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Flynn ${VERSION}" \
            --notes-file "${NOTES_FILE}" \
            --dir build/release \
            --draft "${{ steps.mode.outputs.DRAFT }}" \
            --prerelease "${{ steps.mode.outputs.PRERELEASE }}"

      - name: Dispatch plugin releases
        if: ${{ inputs.dispatch_plugins }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          PRERELEASE="${{ steps.mode.outputs.PRERELEASE }}"
          echo "Queueing Dispatch plugin releases for ${VERSION} prerelease=${PRERELEASE}"
          gh workflow run plugin-releases.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF_NAME}" \
            -f "version=${VERSION}" \
            -f "prerelease=${PRERELEASE}"
