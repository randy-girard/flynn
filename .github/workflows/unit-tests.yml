name: Unit tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_call:

permissions:
  contents: write

env:
  GO_VERSION: '1.24'
  GOFLAGS: '-mod=vendor -buildvcs=false'

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install system dependencies
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libseccomp-dev \
            libdevmapper-dev \
            postgresql \
            postgresql-contrib \
            zfsutils-linux \
            bats \
            jq \
            curl \
            git

      - name: Start PostgreSQL
        run: |
          sudo service postgresql start
          # Peer auth as the runner user (and root for sudo tests) needs matching roles.
          RUNNER_USER="$(id -un)"
          sudo -u postgres createuser -s "${RUNNER_USER}" 2>/dev/null || true
          sudo -u postgres createuser -s root 2>/dev/null || true
          echo "PGHOST=/var/run/postgresql" >> "$GITHUB_ENV"
          echo "PGSSLMODE=disable" >> "$GITHUB_ENV"

      - name: Build Flynn binaries
        run: |
          git config --global --add safe.directory "${{ github.workspace }}"
          export CGO_ENABLED=1
          ./script/build-flynn

      - name: Run gofmt check
        run: util/commit-validator/validate-gofmt

      - name: Run bats script tests
        run: bats script/test

      - name: Run unit tests
        run: |
          set -eo pipefail
          make test-unit-root-native 2>&1 | tee unit-test-output.log

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload unit test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-output
          path: unit-test-output.log
          if-no-files-found: ignore
          retention-days: 7

  coverage-badge:
    name: Coverage badge
    needs: unit
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && needs.unit.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download coverage
        uses: actions/download-artifact@v7
        with:
          name: coverage-html
          path: coverage

      - name: Publish coverage badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./script/ci-push-coverage-badge
